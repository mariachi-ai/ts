name: Release

# After CI passes on main:
#   - while changesets are pending, opens or updates the "Version Packages" pull request;
#   - once that is merged, publishes the packages npm doesn't have yet.
#
# Publishing uses npm trusted publishing: npm takes a short-lived token GitHub issues to this
# workflow (OIDC), so there is no npm token in the repository, and every release carries provenance.
# The publish job runs in the `npm-publish` environment, which asks a reviewer to approve.
#
# Set up once, outside this file (see the pull request that added it):
#   - Settings → Actions → General: allow GitHub Actions to create pull requests
#   - Settings → Environments: `npm-publish`, with a required reviewer, limited to the main branch
#   - npmjs.com, each @mariachi package → Settings → Trusted publisher: this repository, `publish.yml`,
#     environment `npm-publish`
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: release

# Nothing by default; each job asks for what it needs
permissions: {}

jobs:
  plan:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changesets: ${{ steps.plan.outputs.changesets }}
      unpublished: ${{ steps.plan.outputs.unpublished }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - id: plan
        run: node scripts/release-plan.mjs

  # Opens or updates the "Version Packages" pull request. Publishes nothing and holds no npm access.
  version:
    needs: plan
    if: ${{ needs.plan.outputs.changesets != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes what npm doesn't have. Starts only when there is something to publish, and waits for
  # the environment's reviewer.
  publish:
    needs: plan
    if: ${{ needs.plan.outputs.changesets == '0' && needs.plan.outputs.unpublished != '0' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # release tags
      id-token: write # the OIDC token npm exchanges for publish access, and signs provenance with
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or later and Node 22.14 or later; Node 22 ships an older npm
      - run: npm install -g npm@^11.5.1
      - run: |
          node -e "const [a,b,c]=process.versions.node.split('.').map(Number); if (a<22||(a===22&&b<14)) { console.error('Node 22.14 or later is needed, found '+process.versions.node); process.exit(1) }"
          npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # No NPM_TOKEN and no NODE_AUTH_TOKEN here: with either set, npm uses it and skips the OIDC exchange
      - run: pnpm exec changeset publish
      - name: Push the release tags
        run: |
          tags=$(git tag --points-at HEAD)
          if [ -n "$tags" ]; then git push origin $(printf 'refs/tags/%s ' $tags); fi
