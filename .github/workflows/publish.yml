name: Release

# After CI passes on a push to main:
#   - while changesets are pending, opens or updates the "Version Packages" pull request;
#   - once that is merged, publishes the packages npm doesn't have yet.
#
# Publishing uses npm trusted publishing: npm takes a short-lived token GitHub issues to this
# workflow (OIDC), so there is no npm token in the repository, and every release carries provenance.
#
# The job that can publish is kept as small as it can be. Any step of a job with `id-token: write`
# can ask for that token, so that job runs no dependency's install script, builds nothing, and holds
# no write token while it installs: the packages are built in a job with no power and handed over.
# It runs in the `npm-publish` environment, which asks a reviewer to approve.
#
# Set up once, outside this file (see the pull request that added it):
#   - Settings → Actions → General: allow GitHub Actions to create pull requests
#   - Settings → Environments: `npm-publish`, with a required reviewer, deployment branches: main only
#   - Settings → Rules: protect main (pull requests required, no force push, no deletion)
#   - npmjs.com, each @mariachi package → Settings → Trusted publisher: this repository, `publish.yml`,
#     environment `npm-publish`
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: release

# Nothing by default; each job asks for what it needs
permissions: {}

# `branches: [main]` above matches a branch by name, and a fork's branch can be called main. So every
# job also requires that the CI run was a push to this repository, and each works on the commit CI
# tested (`workflow_run.head_sha`), not on whatever main has become since.
jobs:
  plan:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changesets: ${{ steps.plan.outputs.changesets }}
      unpublished: ${{ steps.plan.outputs.unpublished }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - id: plan
        run: node scripts/release-plan.mjs

  # Opens or updates the "Version Packages" pull request. Publishes nothing and holds no npm access.
  version:
    needs: plan
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.changesets != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The write token is not left in .git/config: the action below commits through the API
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
      # No dependency's install script runs in a job that can write to the repository
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds what will be published, with no write access and no way to publish.
  build:
    needs: plan
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.changesets == '0' && needs.plan.outputs.unpublished != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-dists
          path: packages/*/dist
          if-no-files-found: error
          retention-days: 1

  # Publishes what npm doesn't have: the commit CI tested, as the build job built it. Starts only when
  # there is something to publish, and waits for the environment's reviewer.
  publish:
    needs: [plan, build]
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.changesets == '0' && needs.plan.outputs.unpublished != '0' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # release tags
      id-token: write # the OIDC token npm exchanges for publish access, and signs provenance with
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or later and Node 22.14 or later; Node 22 ships an older npm.
      # One exact version, not a range: this is the job that can publish.
      - run: npm install -g npm@11.6.2
      - run: |
          node -e "const [a,b]=process.versions.node.split('.').map(Number); if (a<22||(a===22&&b<14)) { console.error('Node 22.14 or later is needed, found '+process.versions.node); process.exit(1) }"
          test "$(npm --version)" = "11.6.2"
      # No dependency's install script runs here: any step of this job can ask for the publish token
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-dists
          path: packages
      # No NPM_TOKEN and no NODE_AUTH_TOKEN here: with either set, npm uses it and skips the OIDC exchange
      # No package's own publish-time script (prepack, prepublishOnly) runs either: the build job made
      # everything that ships. A package that needs one must do that work in its build script instead.
      - run: pnpm exec changeset publish
        env:
          npm_config_ignore_scripts: "true"
      - name: Push the release tags
        # The only step that is given the repository token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(git tag --points-at HEAD)
          if [ -n "$tags" ]; then
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" $(printf 'refs/tags/%s ' $tags)
          fi
