name: Explorer Pages

# Publishes the explorer to GitHub Pages under /<repo>/. Manual only (Actions → Explorer Pages →
# Run workflow), so the site isn't deployed until someone chooses to, and a Pages problem can't fail
# CI or hold up a release. Needs Pages enabled with "GitHub Actions" as the source.
on:
  workflow_dispatch:

jobs:
  explorer-pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency: pages
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @mariachi/explorer build
        env:
          EXPLORER_BASE: /${{ github.event.repository.name }}/
          EXPLORER_SITE: https://${{ github.repository_owner }}.github.io
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/explorer/dist/site
      - id: deploy
        uses: actions/deploy-pages@v4
