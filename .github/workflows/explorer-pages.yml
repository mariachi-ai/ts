name: Explorer Pages

# Publishes the explorer to GitHub Pages under /<repo>/. Manual only (Actions → Explorer Pages →
# Run workflow), so the site isn't deployed until someone chooses to, and a Pages problem can't fail
# CI or hold up a release. Needs Pages enabled with "GitHub Actions" as the source.
on:
  workflow_dispatch:

jobs:
  explorer-pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency: pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @mariachi/explorer build
        env:
          EXPLORER_BASE: /${{ github.event.repository.name }}/
          EXPLORER_SITE: https://${{ github.repository_owner }}.github.io
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: packages/explorer/dist/site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5