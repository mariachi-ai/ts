name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI reads the repository and nothing else
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm docs:check
      - run: pnpm test:unit
        env:
          # The design probe tests need a real browser: the runner's own Chrome (locally they default to
          # Playwright's bundled Chromium)
          MARIACHI_CHROME: /usr/bin/google-chrome

  integration:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mariachi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      typesense:
        image: typesense/typesense:27.1
        env:
          TYPESENSE_API_KEY: test-key
          TYPESENSE_DATA_DIR: /tmp
        ports: ["8108:8108"]
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/mariachi_test
      REDIS_URL: redis://localhost:6379
      TYPESENSE_URL: http://localhost:8108
      TYPESENSE_API_KEY: test-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:integration

  explorer:
    # Browser checks and visual regression for @mariachi/explorer and @mariachi/design. Runs in the
    # Playwright image so screenshots match the committed Linux baselines.
    runs-on: ubuntu-latest
    needs: check
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @mariachi/explorer test:browser
      - run: pnpm --filter @mariachi/explorer test:visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: explorer-playwright-report
          path: packages/explorer/playwright-report
          retention-days: 7
